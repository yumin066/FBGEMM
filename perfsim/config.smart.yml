# overall workflow settings
all:
  retryTimeoutMinutes: 240
  retryIntervalMinutes: 5

cuda2ctlAmodel_single_step:
  # used for the -cuda2ctlAmodel -singleStep path:
  # mem = max of all lsfQueue mem settings below
  # time = sum of lsfQueue time settings below
  lsfQueue: o_cpu_16G_24H
  # timeout for lsf job, does not account for PEND time. Value is in minutes as an integer, -1 means no timeout
  lsfTimeout: -1

  compress: 1

APIC_Capture:
  # used for -cudaApicAmodel
  lsfQueue: o_cpu_32G_24H
  # timeout for lsf job, does not account for PEND time. Value is in minutes as an integer, -1 means no timeout
  lsfTimeout: -1

  # absolute path to the cuda_apic_capture.pl script to use instead of the default one
  # (a qualified release from /home/scratch.svc_compute_arch/release/cuda_apic)
  cuda_capturer: ~

  # absolute path to the cudaReplayer executable to use instead of the default one
  # (a qualified release from /home/scratch.svc_compute_arch/release/cuda_apic)
  # the cudaReplayer is used to read information out of a cuda apic using -ReportInfo
  cuda_replayer: ~

  # capture options to be passed to cuda_apic_capture.pl
  # in the amodel case these will be passed to apic_amodel using the -capture_args_more option
  # do not specify --pp_args=, this is done through the postprocess/options setting below
  capture:
    options:
      # even though this is the default it is here as a placeholder to create the list
      # - --knob <knob name>=<knob value>
      # - --knob LoadEntryOverride=False
      - --capture_mode=discrete

  # args to pass to apic_amodel
  apic_amodel_args: {}

  # post process options can be stored in the workload CADI record, those options and these options are union-ed
  # to produce the runtime options which are then stored as the settings in the APIC CADI record
  # These options are passed in --pp_args
  # The format is the same as the capture/options above, [] means empty list
  postprocess:
    options: []

# settings for the Trace3D generation phase
Trace3D_Gen:
  # if more time is needed increase the H value (hours), or use a D value (days)
  lsfQueue: o_cpu_16G_24H
  # timeout for lsf job, does not account for PEND time. Value is in minutes as an integer, -1 means no timeout
  lsfTimeout: -1

  # set this to override the cuda replayer that will be used
  # default is to tie it to the cuda_replayer or cuda_capturer used above, in that order of precedence
  # absolute path to the cudaReplayer executable
  cuda_replayer: ~

  # more options to pass to cudaReplayer when running traces, this is defined as a space-separated string
  cuda_replay_options: '-MergeUVACtx'

  # environment variables to set for cudaReplayer execution
  # Example:
  # cuda_replay_env:
  #   CUDA_FORCE_PTX_JIT: 0
  #   CUDA_TSG_CHANNEL_COUNT: 1
  #
  cuda_replay_env:
    CUDA_FORCE_PTX_JIT: 0
    CUDA_TSG_CHANNEL_COUNT: 1

  # A map of options to pass to cuda2ctl (compute_cuda2ctl), {} means empty map and no additional options are passed
  # Example syntax
  # cuda2ctl_args:
  #   example_switch: ~
  #   example_arg_with_value: example_value
  #
  cuda2ctl_args: {}

  # A map of options to pass to htg (htg.py), {} means empty map and no additional options are passed
  # Example syntax
  # htg_args:
  #   example_switch: ~
  #   example_arg_with_value: example_value
  #
  htg_args: {}

  # A map of options to pass to ACE (run-ace.pl)
  # Example syntax
  # ACE_args:
  #   -example_switch: ~
  #   -example_arg_with_value: example_value
  #
  ACE_args:
    -pmMode: PMMODE_NOCOLLAPSE

  # see https://wiki.nvidia.com/gpuhwdept/index.php/AModel/Knobs for syntax
  # Remember to quote special yaml characters like [] and {}
  # Examples:
