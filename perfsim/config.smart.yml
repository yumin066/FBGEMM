# settings for the STB generation phase
STB_Gen:
  # if more time is needed increase the H value (hours), or use a D value (days)
  lsfQueue: o_cpu_16G_4H
  lsfTimeout: -1

  # generate STB even if it already exists in the trace
  force_stb_gen: 0

  perfgen:
    -PERFSIM:knob:
      - '''NVPerfsim::pmTriggerDumpRange 1 (0 10000)'''
      - '''Shader::checkUninitializedRegisters 0'''
    -debug: 0
    -dont-fail-on-p4-check:

    -queue:
      - PERFSIM o_cpu_64G_48H # increase this if the perfgen lsf.log shows TERM_MEMLIMIT or time limit
      - REPORT o_cpu_4G_4H # this one gives double the memory of the default, final.log was showing TERM_MEMLIMIT in some gh100 cases
      - FINAL o_cpu_4G_4H # this one gives double the memory of the default, final.log was showing TERM_MEMLIMIT in some gh100 cases

    -PERFSIM:run_type: app_perf
    -no-perfalyze: ~

    -rc:
      - ${chip}/${chip}_flow.perfsim.rc
    -target: PERFSIM

Smart:
  lsfQueue: o_cpu_16G_24H
  # timeout for lsf job, does not account for PEND time. Value is in minutes as an integer, -1 means no timeout
  lsfTimeout: -1

  useSmart2: false
  enableMorph: false
  pic: false

  # A map of options to pass to smart or smart2, {} means empty map and no additional options are passed
  # Example syntax
  # smart:
  #   --example_switch: ~
  #   --example_arg_with_value: example_value
  #   --example_arg_repeated_with_multiple_values:
  #     - example_value1
  #     - example_value2
  #
  # Example of passing a perfsim knob to smart
  # smart:
  #   --PerfSimKnob:
  #     - PerfSim::enableVPMLogging=1
  #
  # NOTE: smart requires specific ways of passing knobs, see the examples and comments below
  # More examples of passing args to smart
  # smart:
  #   --pivot-table: pm.csv
  #   --Knob:
  #     # NOTE: turn these on to avoid failures due to uninitialized register reads
  #     # NOTE: required = for the value
  #     - failOnUninitializedSharedRead=0
  #     - failOnUninitializedRegisterRead=0
  #     # NOTE: these are REGEXP syntax examples, there is no = for the value and the quoting has to be just like this
  #     - REGEXP="Text::SM0_0_.*::MicroSchedLog.*::Enable 1"
  #     - REGEXP="Text::SM0_0_.*::DispatchLog.*::Enable 1"
  #   --Knob:
  #     - failOnUninitializedSharedRead=0
  #     - SM::splinterEnable=0
  #     - numTPCsPerGPC=8 # Add this line to config 8 TPC, 16 SM config
  #   --PerfSimKnob:
  #     - PerfSim::enableVPMLogging=1
  #     - PerfSim::VPMLogFormat=sqlite3
  #     - PerfSim::VPMLogInterval=100
  #     - PerfSim::VPMDumpOutsidePMRegion=1
  #     - REGEXP="SM.*::(.*throttle.*|warp_cant_issue.*|inst_executed.*|.*stall.*|side_collector_full|wavefront_count.*|.*coalescing)::enableStatLogging 1"
  #
  smart:
    # for knobfiles, the smart release chip-specific base_knobs.txt is always prepended
    # this is for only a single tpc to be enabled
    --knobfile: ${knobfile_chip}_single_tpc.cfg
    # this is for all tpcs in a gpc to be enabled
    # --knobfile: ${knobfile_chip}_single_full_gpc.cfg

  # can set this to an absolute path or a relative path (so the flow's smart release will take effect)
  # if not set, the flow will set it to the one corresponding to the --knobfile in the smart settings
  # eg. /hw/class/ampere/similar/nvpdm/ga100_test_config.xml
  catalyze_test_config: ~

Smart_Profiler:
  lsfQueue: o_cpu_32G_24H
  # timeout for lsf job, does not account for PEND time. Value is in minutes as an integer, -1 means no timeout
  lsfTimeout: -1

  # Example:
  # smart_profiler:
  #   -Knob:
  #     - NVPerfsim::numTPCsPerGPC=10
  #     - NVPerfsim::UseGfxOnlyGPC0TPCs=1
  #   -ld_lib_path_more: "/path/to/lib:/home/utils/gcc-14.1.0/lib64"
  smart_profiler:
    -PrintLevel: debug
    -Knob: []
    -knobs_file: ~
    -ld_lib_path_more: ~

  pic_smart:
    --dump-all-morph-tpc: false
    --barrier-analysis: true

PIC_Analysis:
  lsfQueue: o_cpu_64G_4H
  # timeout for lsf job, does not account for PEND time. Value is in minutes as an integer, -1 means no timeout
  lsfTimeout: -1
  lsfCpus: 8

  # A map of options to pass to pic-smart
  # Example syntax
  # pic-smart:
  #   --example_switch: boolean_value_to pass_or_not
  #   --example_arg_with_value: example_value
  #
  pic-smart:
    --dump-all-morph-tpc: false
    --barrier-analysis: true

